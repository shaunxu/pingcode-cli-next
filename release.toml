# cargo-release 配置：https://github.com/crate-ci/cargo-release
# 发版入口是 scripts/release.sh（先由 tools/release.py 计算版本号，再调 cargo release）。
#
# 两阶段发布（main 受 branch protection 保护）：
#   1. scripts/release.sh 在 release/vX.Y.Z 分支上运行 cargo release --execute
#      --no-tag --no-push --allow-branch '*'：只做 bump、CHANGELOG hook 与提交，
#      然后 push 分支、用 gh 开 PR（因此下方 tag/push 必须关闭，分支限制由 CLI 覆盖）。
#   2. PR 合并到 main 后，.github/workflows/release-tag.yml 自动打 tag 并推送
#      （用 RELEASE_PAT，GITHUB_TOKEN 推的 tag 不会触发其他 workflow），
#      tag 推送触发 cargo-dist 的 release workflow 完成构建与分发。

# 不发布到 crates.io，仅在 GitHub 发版（二进制分发由 cargo-dist 接管）。
publish = false

# 打 tag / push 由 CI（release-tag.yml）负责；cargo-release 只做本地准备。
tag = false
push = false

# release 提交信息（Conventional Commits，与 committed 校验兼容）。
pre-release-commit-message = "chore(release): v{{version}}"

# 发版前由 tools/release.py 依据 PREV_VERSION..HEAD 的 Conventional Commits 重写
# CHANGELOG.md（cargo-release 会把它对 CHANGELOG.md 的改动一并纳入 release 提交）。
pre-release-hook = ["python3", "tools/release.py", "changelog"]

# 跳过 cargo publish 的打包/构建校验（不发布 crate；verify 默认会跑 cargo publish --dry-run）。
verify = false

# 只允许在 main 分支发版；release.sh 在 release 分支上通过 --allow-branch '*' 覆盖此限制。
allow-branch = ["main"]
