# cargo-release 配置：https://github.com/crate-ci/cargo-release
# 发版入口是 scripts/release.sh（先由 tools/release.py 计算版本号，再调 cargo release）。

# 不发布到 crates.io，仅在 GitHub 发版（二进制分发由 cargo-dist 接管）。
publish = false

# tag 名 vX.Y.Z：tag-name 默认 "{{prefix}}v{{version}}"，根 crate 的 prefix 默认空，
# 因此不要设 tag-prefix（设成 "v" 会得到 vvX.Y.Z）。
tag = true
tag-message = "chore(release): {{tag_name}}"

# release 提交信息（Conventional Commits，与 committed 校验兼容）。
pre-release-commit-message = "chore(release): v{{version}}"

# 打 tag 后推送分支与 tag；tag 推送触发 cargo-dist 的 release workflow。
push = true
push-remote = "origin"

# 发版前由 tools/release.py 依据 PREV_VERSION..HEAD 的 Conventional Commits 重写
# CHANGELOG.md（cargo-release 会把它对 CHANGELOG.md 的改动一并纳入 release 提交）。
pre-release-hook = ["python3", "tools/release.py", "changelog"]

# 跳过 cargo publish 的打包/构建校验（不发布 crate；verify 默认会跑 cargo publish --dry-run）。
verify = false

# 只允许在 main 分支发版。
allow-branch = ["main"]
