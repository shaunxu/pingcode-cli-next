name: Bug 报告
description: 报告 pc 使用中遇到的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索现有 issue 避免重复，并尝试用最新版本复现。
        **请勿在 issue 中粘贴 Client ID / Client Secret / 访问令牌等凭据。**
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明遇到了什么问题
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pc 版本
      description: 运行 `pc --version` 的输出
      placeholder: pc 0.5.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Linux (x86_64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x86_64)
        - 其他
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - Shell 一键安装脚本
        - PowerShell 一键安装脚本
        - Homebrew
        - Releases 压缩包
        - 从源码构建（cargo）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 执行的命令与参数（建议先用 `--dry-run` 预览，确认输出中不含凭据后再粘贴）
      placeholder: |
        1. pc ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / 错误输出
      description: 完整的错误消息或 stderr 输出（可附 `-v` 调试输出，请先脱敏）
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，没有找到相同问题
          required: true
        - label: 我已确认粘贴的内容中不包含凭据或其他敏感信息
          required: true
