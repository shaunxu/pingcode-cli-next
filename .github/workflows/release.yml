name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: pc-${{ github.ref_name }}-linux-x86_64.tar.gz
            pack: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: pc-${{ github.ref_name }}-macos-arm64.tar.gz
            pack: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: pc-${{ github.ref_name }}-windows-x86_64.zip
            pack: zip
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target $TARGET
      - name: Package (tar.gz)
        if: matrix.pack == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/${ARCHIVE%.tar.gz}"
          mkdir -p "$stage"
          cp "target/$TARGET/release/pc" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -C dist -czf "dist/$ARCHIVE" "$(basename "$stage")"
      - name: Package (zip)
        if: matrix.pack == 'zip'
        shell: pwsh
        run: |
          $stage = "dist/$($env:ARCHIVE -replace '\.zip$','')"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/pc.exe" "$stage/"
          Copy-Item "README.md", "LICENSE" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$env:ARCHIVE"
      - name: Create GitHub release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/$ARCHIVE" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
