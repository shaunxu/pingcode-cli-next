name: Commit Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  committed:
    name: Lint commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commits
        uses: crate-ci/committed@v1.1.11
