[package]
name = "pc"
version = "0.1.0"
edition = "2021"
description = "Command Line Interface for PingCode Open API"
license = "MIT"
readme = "README.md"

[[bin]]
name = "pc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
